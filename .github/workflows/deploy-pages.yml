name: Deploy client to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/bedrock-addons-maps-app-2izpjr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        # Set this repo variable (Settings -> Secrets and variables -> Actions
        # -> Variables) once the server proxy is deployed somewhere, so the
        # client knows where to send API requests.
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        # GitHub Pages is static hosting with no server-side rewrites, so a
        # direct/refreshed deep link (e.g. /addons/123) 404s. Copying the app
        # shell to 404.html makes Pages serve it for any unknown path, and
        # React Router then picks up the real URL client-side.
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
